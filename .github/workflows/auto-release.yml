name: Auto Release

on:
  workflow_dispatch:
  schedule:
    # At 01:00 (1 AM) every day
    - cron: '0 1 * * *'

# Each job requests only the permissions it needs.
permissions: {}

jobs:
  # Runs third-party dependencies and API calls, so it gets read-only access
  # and no publishing credentials.
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.bump-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump patch version
        id: bump-version
        run: |
          VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build assets
        run: pnpm start
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          API_AUTH_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}

      # The wallet data component, consumed by brave-core-crx-packager.
      - name: Package release asset
        working-directory: build
        run: zip -qr ../wallet-lists.zip .

      # Only build output crosses into the later jobs. Anything else, such as
      # package.json, would let build-time code change what those jobs publish.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/
            wallet-lists.zip
          if-no-files-found: error
          retention-days: 1

  # Commits, signs and publishes the GitHub release. Runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    permissions:
      contents: write # push the build commit and create the release
      id-token: write # sign the build provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Re-applies the version bump to the trusted checkout's package.json.
      - name: Commit build assets
        id: commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts
          git add build/ package.json
          git commit -m "ci: update build assets (${VERSION})"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attest release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: wallet-lists.zip

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: wallet-lists.zip
          fail_on_unmatched_files: true

  # Publishes the build output to npm. Runs no project code. The trusted
  # publisher on npmjs.com keys on this repository and this filename, not on a
  # job name, and it has no environment.
  npm:
    needs: [build, publish]
    if: github.repository == 'brave/wallet-lists'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Manifest is written here from the trusted checkout. The build artifact
      # only supplies data files, so build-time code cannot change what is published.
      - name: Publish to npm
        run: |
          set -eu
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packagedVersion = fs.readFileSync('build/VERSION', 'utf8').trim().replace(/^v/, '');
          if (pkg.version !== packagedVersion) {
            console.error(`package.json version (${pkg.version}) does not match build/VERSION (${packagedVersion})`);
            process.exit(1);
          }

          pkg.name = '@brave/wallet-lists';
          pkg.publishConfig = { access: 'public' };
          pkg.scripts = {};
          pkg.devDependencies = {};
          pkg.dependencies = {};
          pkg.engines = {};
          delete pkg.private;
          delete pkg.packageManager;
          delete pkg.type;
          fs.rmSync('build/.npmrc', { force: true });
          fs.writeFileSync('build/package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          # Provenance is attached automatically for trusted publishing from a public
          # repository. --provenance keeps that explicit. No NODE_AUTH_TOKEN: a token
          # would hide OIDC and skip the trusted-publisher path. --ignore-scripts keeps
          # a lifecycle script from running during the publish itself.
          # A version already on the registry is left alone, so re-running this job
          # after a publish that landed does not fail the run.
          name="$(node -p 'require("./build/package.json").name')"
          version="$(node -p 'require("./build/package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; not publishing it again"
          else
            npm publish ./build --access public --provenance --ignore-scripts
          fi
