name: Auto Release

on:
  workflow_dispatch:
  schedule:
    # At 01:00 (1 AM) every day
    - cron: '0 1 * * *'

# Each job requests only the permissions it needs.
permissions: {}

jobs:
  # Runs third-party dependencies and API calls, so it gets read-only access
  # and no publishing credentials.
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.bump-version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump patch version
        id: bump-version
        run: |
          VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build assets
        run: pnpm start
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          API_AUTH_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}

      # The wallet data component, consumed by brave-core-crx-packager.
      - name: Package release asset
        working-directory: build
        run: zip -qr ../wallet-lists.zip .

      # Only build output crosses into the publish job. Anything else, such as
      # package.json, would let build-time code change what the publish job runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/
            wallet-lists.zip
          if-no-files-found: error
          retention-days: 1

  # Commits, signs and publishes the build output. Runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write # push the build commit and create the release
      id-token: write # sign the build provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Re-applies the version bump to the trusted checkout's package.json.
      - name: Commit build assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts
          git add build/ package.json
          git commit -m "ci: update build assets (${VERSION})"
          git push

      - name: Attest release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: wallet-lists.zip

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: wallet-lists.zip
          fail_on_unmatched_files: true
